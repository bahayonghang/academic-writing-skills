# latex-thesis-zh/scripts/check_claim_forward.py 的 claim-forward（主张前置）词表
#
# 脚本内置等值回退表（_DEFAULT_TERMS）。调词表改这里，不改代码；某字段缺失或非法时
# 只有该字段回退到内置值。
#
# 基线：5 篇私有博士学位论文（仅研究用，不进测试）。遗憾的是 / 仍明显落后 / 存在严重不足 /
# 本文不试图 / 并不主张 = 0 次；效果有限 = 1；未能 = 3（均指他人工作）；裸“仅”15–48 次/篇
# （多为“仅为 0.018”“不仅”），故只收搭配，不收裸字。“尚未”是摘要痛点词（T-PAIN），不收。
version: 1

# 自我削弱搭配（CF-SELFWEAK）。prefer 是候选模板；花括号占位由 LLM 从稿件证据填入，
# 不得编造。prefer 为空表示删除该引导词。subject_gate 表示只有句中出现这些主语时才报，
# 且在“不足/局限”小节内不报（那里本就该写限制）。基线中“存在较大差距 / 效果有限 /
# 并不理想”的命中全部指向行业现状或对比基线，故评价类搭配也加主语门控。
self_weakening:
  - match: "遗憾的是"
    prefer: ""
  - match: "令人遗憾"
    prefer: ""
  - match: "仍明显落后于"
    prefer: "落后{gap}于"
  - match: "仍明显落后"
    prefer: "落后{gap}"
  - match: "明显落后于"
    prefer: "落后{gap}于"
  - match: "效果有限"
    prefer: "在{scope}上提升{value}"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "存在严重不足"
    prefer: "在{aspect}上受限于{cause}"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "存在较大差距"
    prefer: "相差{gap}"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "并不理想"
    prefer: "为{value}"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "差强人意"
    prefer: "为{value}"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "略显不足"
    prefer: "为{value}"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "仅能"
    prefer: "能够"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "仅仅"
    prefer: ""
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]
  - match: "未能"
    prefer: "尚未在{scope}上"
    subject_gate: ["本文", "本章", "本研究", "所提", "本方法", "提出的"]

# 主张句内计数的 hedge（CF-HEDGE-STACK 在 ≥3 时触发；“有望”在结论/总结章不计）。
hedges:
  - "可能"
  - "或许"
  - "也许"
  - "在一定程度上"
  - "一定程度"
  - "某种程度"
  - "大致"
  - "基本上"
  - "相对而言"
  - "似乎"
  - "有望"

# 段首否定式免责句（CF-DISCLAIM）。
disclaim_openers:
  - "本文不试图"
  - "本文并不主张"
  - "本文无意"
  - "本研究不涉及"
  - "本文并未"
  - "本文不讨论"
  - "本文不追求"
  - "本章不试图"

# 方向标记：负面判定之后（同段）出现即不报 CF-CLOSE-NEG。
direction_markers:
  - "展望"
  - "未来工作"
  - "未来研究"
  - "后续工作"
  - "后续研究"
  - "下一步"
  - "有待"
  - "进一步研究"
  - "进一步探索"
  - "可进一步"
  - "值得进一步"
  - "将在后续"

# 过程编年开头。只供 [LLM] 的 CF-LOSS-FRAME 判断使用，脚本不发。
process_openers:
  - "起初"
  - "最初尝试"
  - "经过多次尝试"
  - "我们曾"
  - "曾尝试"

# 标题含以下词的章节视为限制/范围专章：其内关闭 CF-DISCLAIM / CF-CAVEAT-POS / CF-CLOSE-NEG。
limitation_section_titles:
  - "不足"
  - "局限"
  - "研究范围"
  - "范围界定"
