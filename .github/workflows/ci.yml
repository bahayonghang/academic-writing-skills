name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_FROZEN: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Show toolchain versions
        run: |
          python --version
          uv --version
          just --version

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Run project CI gate
        run: just ci

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Show toolchain versions
        run: |
          python --version
          uv --version
          node --version
          npm --version

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Check resource sync
        run: uv run --extra dev python docs/scripts/check_resource_sync.py

      - name: Build docs
        run: npm --prefix docs run docs:build
