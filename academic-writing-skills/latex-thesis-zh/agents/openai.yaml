interface:
  display_name: "LaTeX Thesis ZH"
  short_description: "Compile, inspect, and mainline-polish Chinese LaTeX theses across template, structure, logic, literature, experiments, and thesis review responses"
  default_prompt: "Review my Chinese LaTeX thesis project, infer the right module from the request, sequence compatible modules when needed, ask only for missing entry-file or context details, run the relevant uv-backed scripts, and return thesis-focused findings or chapter-mainline writing plans. For thesis review reports, infer rebuttal-intake/build/check, preserve reviewer quotes, obtain revision-plan approval, and report evidence and skipped checks; exclude Beamer decks and journal rebuttal letters."
